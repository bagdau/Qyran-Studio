services:
  api:
    build:
      context: ./backend
    container_name: qyran-api
    environment:
      POSTGRES_HOST: db
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: qyran-db
    env_file:
      - path: .env
        required: false
        format: raw
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-qyran} -d $${POSTGRES_DB:-qyran}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
